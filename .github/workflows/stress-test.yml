# ════════════════════════════════════════════════════════════════════════════
#  PyCoder 高并发 fixture 压测 — 独立 workflow
#
#  触发条件: push / PR 到 main/master 分支 (与主 CI 并行)
#  验证内容: fresh_store fixture 修复 (tmp_path 隔离) 在高并发下的稳定性
#  4 阶段: xdist 进程级并行 / 实例隔离 / 单例线程安全 / 残留物泄漏检测
#  重试策略: 最多 3 次, 偶发超时自动恢复; 全部失败才阻断合并
#
#  ─── 门禁配置 ───
#  此 workflow 为独立 job, 无法通过 needs 依赖主 CI。
#  要使其成为合并门禁, 需在 GitHub 仓库设置中配置 Branch Protection:
#    Settings → Branches → Branch protection rules → master
#    → Require status checks to pass before merging
#    → 添加 "高并发 fixture 压测" 为必需检查
# ════════════════════════════════════════════════════════════════════════════

name: 高并发压测

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:  # 允许手动触发 (setup_branch_protection.sh 自动调用)

# ── 最小权限原则: 显式声明 GITHUB_TOKEN 所需权限 ──────────
# contents: read   — 检出代码
# actions: read    — 读取 workflow 运行状态 (setup_branch_protection.sh 需要)
permissions:
  contents: read
  actions: read

# 取消同一 PR 的旧运行，节省 CI 资源
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stress-test:
    name: "高并发 fixture 压测"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          allow-prereleases: true

      # ── 权限预检查: 验证 GITHUB_TOKEN 具备所需权限 ──────
      # 记录检查耗时、当前 scope、缺失 scope 等详细信息
      - name: 验证 GITHUB_TOKEN 权限
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "═══════════════════════════════════════════════════"
          echo "  GITHUB_TOKEN 权限预检查"
          echo "═══════════════════════════════════════════════════"
          START_TIME=$(date +%s)

          # 运行权限检查, 捕获 JSON 输出
          CHECK_OUTPUT=$(python scripts/gh_permissions.py \
            --check-only \
            --json \
            --no-interactive \
            --scopes repo workflow 2>&1) || true

          END_TIME=$(date +%s)
          ELAPSED=$((END_TIME - START_TIME))

          # 解析 JSON 并打印详细 scope 信息
          echo ""
          echo "── 检查结果 ──────────────────────────────────────"
          echo "$CHECK_OUTPUT" | python -c "
          import sys, json
          lines = sys.stdin.read()
          start = lines.find('{')
          if start == -1:
              print('  (无法解析输出, 原始输出:)')
              print(f'  {lines[:300]}')
              sys.exit(0)
          try:
              data = json.loads(lines[start:])
          except json.JSONDecodeError as e:
              print(f'  (JSON 解析失败: {e})')
              print(f'  原始输出: {lines[start:start+300]}')
              sys.exit(0)

          ok = data.get('ok', False)
          print(f\"  通过:           {'✅' if ok else '❌'}\")
          print(f\"  已认证:         {'✅' if data.get('authenticated') else '❌'}\")
          print(f\"  Token 有效:     {'✅' if data.get('token_valid') else '❌'}\")
          if data.get('username'):
              print(f\"  用户名:         {data['username']}\")
          current = data.get('current_scopes', [])
          print(f\"  当前 scope ({len(current)}): {', '.join(current) if current else '(无)'}\")
          required = data.get('required_scopes', [])
          print(f\"  必需 scope ({len(required)}): {', '.join(required)}\")
          missing = data.get('missing_scopes', [])
          if missing:
              print(f\"  缺失 scope ({len(missing)}): {', '.join(missing)}\")
          else:
              print(f\"  缺失 scope:     (无)\")
          if data.get('error'):
              print(f\"  错误信息:       {data['error']}\")
          " 2>/dev/null || echo "  (JSON 解析失败, 原始输出: ${CHECK_OUTPUT:0:300})"

          echo ""
          echo "── 耗时 ──────────────────────────────────────────"
          echo "  开始时间: $(date -d @${START_TIME} '+%Y-%m-%d %H:%M:%S UTC' 2>/dev/null || echo ${START_TIME})"
          echo "  结束时间: $(date -d @${END_TIME} '+%Y-%m-%d %H:%M:%S UTC' 2>/dev/null || echo ${END_TIME})"
          echo "  检查耗时: ${ELAPSED}s"
          echo ""

          # 判断最终结果
          if echo "$CHECK_OUTPUT" | python -c "
          import sys, json
          lines = sys.stdin.read()
          start = lines.find('{')
          if start >= 0:
              data = json.loads(lines[start:])
              sys.exit(0 if data.get('ok') else 1)
          sys.exit(1)
          " 2>/dev/null; then
            echo "✅ 权限检查通过 (耗时 ${ELAPSED}s)"
          else
            echo "⚠️  GITHUB_TOKEN 权限不足, 但 CI 将继续执行"
            echo "    (GITHUB_TOKEN 使用 permissions: 块控制, 非 PAT scope)"
            echo "    如需完整 scope 检查, 请使用 PAT 配置 GH_TOKEN secret"
          fi
          echo "═══════════════════════════════════════════════════"

      - name: 缓存 pip 依赖
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: stress-pip-${{ hashFiles('pyproject.toml') }}
          restore-keys: stress-pip-

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install -r requirements/requirements-dev.txt

      - name: 运行高并发 fixture 压测 (带重试)
        # workers=8 适配 CI 2-4 核 runner; rounds=2 平衡覆盖与耗时
        # 完整 4 阶段: xdist 并行 + 实例隔离 + 线程安全 + 泄漏检测
        # 重试策略: 最多 3 次, 偶发超时自动恢复; 全部失败才阻断合并
        run: |
          max_attempts=3
          for attempt in $(seq 1 $max_attempts); do
            echo "::group::尝试 $attempt/$max_attempts"
            if python scripts/stress_fixture_concurrency.py \
              --workers 8 \
              --rounds 2 \
              --instances 20 \
              --threads 8 \
              --ops 10; then
              echo "::endgroup::"
              echo "✅ 压测通过 (尝试 $attempt/$max_attempts)"
              exit 0
            fi
            echo "::endgroup::"
            if [ $attempt -lt $max_attempts ]; then
              echo "⚠️ 尝试 $attempt/$max_attempts 失败, 10秒后重试..."
              sleep 10
            fi
          done
          echo "❌ $max_attempts 次尝试均失败, 阻断合并"
          exit 1

      - name: 归档压测结果
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stress-test-results
          path: stress-fixture-results.json
          retention-days: 7
