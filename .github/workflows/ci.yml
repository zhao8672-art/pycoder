# ════════════════════════════════════════════════════════════════════════════
#  PyCoder CI — 跨平台持续集成 (Ubuntu + Windows)
#
#  触发条件: push / PR 到 main/master 分支
#  矩阵策略: ubuntu-latest × windows-latest, Python 3.14
#  质量门禁:
#    - ruff check (错误阈值 < 50)
#    - pytest + coverage (覆盖率 >= 80%, 合并所有测试步骤)
#    - mypy 类型检查 (宽松模式, 仅报告不阻塞)
#    - 构建验证 (wheel + import 检查)
#  非阻塞检查:
#    - 慢测试 / 集成测试 (continue-on-error)
#    - 高并发 fixture 压测 (continue-on-error, 稳定后可升级为门禁)
# ════════════════════════════════════════════════════════════════════════════

name: PyCoder CI

on:
  push: { branches: [main, master] }
  pull_request: { branches: [main, master] }

# 取消同一 PR 的旧运行，节省 CI 资源
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 主 CI 矩阵 (跨平台) ──────────────────────────────────────────
  ci:
    name: "${{ matrix.os }} / py${{ matrix.python-version }}"
    runs-on: ${{ matrix.os }}
    # FIX #3: 15→25 分钟, 新增 architecture 串行步骤需要更多时间
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.14"]

    defaults:
      run:
        # 跨平台统一使用 bash，避免 Windows cmd/PowerShell 差异
        shell: bash

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          # Python 3.14 可能需要预发布版本支持
          allow-prereleases: true

      # FIX #6: 添加 pip 缓存, 加速依赖安装
      - name: 缓存 pip 依赖
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~\AppData\Local\pip\Cache
          key: ${{ matrix.os }}-pip-${{ hashFiles('pyproject.toml') }}
          restore-keys: ${{ matrix.os }}-pip-

      - name: 安装依赖
        # 两步安装: requirements-dev.txt 是 pip-compile 全量锁文件,
        # 含传递依赖精确版本, 若通过 .[dev] extras 加载会与 [project]
        # dependencies 的 ~= 范围冲突 (ResolutionImpossible)。
        # 标准用法: 先装包, 再用 pip install -r 装锁文件。
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install -r requirements/requirements-dev.txt

      # FIX #5: Ruff 检查改用 ruff 原生 exit code, 不再内联 Python 解析 JSON
      - name: Ruff 代码检查
        run: |
          ruff check pycoder/ tests/ --output-format=concise --exit-non-zero-on-error
          echo "✅ Ruff 检查通过"

      # FIX #4: Mypy 不再用 || true 吞错, 改为 warning 级别 (不阻塞但可见)
      - name: Mypy 类型检查
        continue-on-error: true
        run: |
          python -m mypy pycoder/ --ignore-missing-imports --show-error-codes

      - name: 运行测试 + 覆盖率 (并行)
        # CI 策略: 跳过 slow/integration 测试，单测超时 60s，并行执行
        # --dist=loadfile: 按文件分配 worker, 避免 sqlite3/线程跨进程崩溃
        # --ignore=tests/e2e_test.py: 脚本式文件, 非 pytest 测试
        # architecture 测试单独用 -n 0 运行, 避免 xdist worker 崩溃
        # FIX #1: --cov-fail-under 移至最终步骤, 避免排除 architecture 后误报
        # FIX #2: 不在此步骤生成 xml 报告, 仅积累 .coverage 数据
        run: |
          python -m pytest tests/ \
            -m "not slow and not integration" \
            --ignore=tests/e2e_test.py \
            --ignore=tests/architecture \
            --cov=pycoder \
            --cov-report=term-missing \
            -ra \
            --tb=short \
            --durations=10 \
            --timeout=60 \
            -n auto \
            --dist=loadfile

      - name: 运行架构测试 (串行)
        # architecture 测试含 sqlite3 连接, xdist 并行会导致 worker 崩溃
        # FIX #2: --cov-append 追加数据, 不在此生成 xml, 统一在最终步骤生成
        run: |
          python -m pytest tests/architecture/ \
            -m "not slow and not integration" \
            --cov=pycoder \
            --cov-append \
            --cov-report=term-missing \
            -ra \
            --tb=short \
            --durations=10 \
            --timeout=120 \
            -n 0

      # FIX #1 + #2: 统一生成覆盖率报告 + 阈值检查
      # 合并两个测试步骤的 .coverage 数据后, 一次性生成 xml 并检查阈值
      - name: 生成覆盖率报告 + 阈值检查
        run: |
          python -m coverage report --fail-under=80
          python -m coverage xml -o coverage.xml

      # FIX #7: 所有平台都上传 Codecov (Windows 代码路径也需要覆盖)
      - name: 上传覆盖率报告到 Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: 归档覆盖率报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.os }}-py${{ matrix.python-version }}
          path: coverage.xml
          retention-days: 7

  # ── 慢测试分片 (独立 job, 不阻塞主 CI 门禁) ──────────────────────
  slow-tests:
    name: "慢测试 / 集成测试"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          allow-prereleases: true
      # FIX #6: 添加 pip 缓存
      - name: 缓存 pip 依赖
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: slow-pip-${{ hashFiles('pyproject.toml') }}
          restore-keys: slow-pip-
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install -r requirements/requirements-dev.txt
      - name: 运行慢测试 + 集成测试
        run: |
          python -m pytest tests/ \
            -m "slow or integration" \
            --ignore=tests/e2e_test.py \
            -ra --tb=short --durations=10 \
            --timeout=180 \
            -n auto \
            --dist=loadfile

  # ── 高并发 fixture 竞争压测 (独立 job, 与主 CI 并行) ──────────────
  # 验证 fresh_store fixture 修复 (tmp_path 隔离) 在高并发下的稳定性。
  # 4 阶段: xdist 进程级并行 / 实例隔离 / 单例线程安全 / 残留物泄漏检测
  # CI 参数保守 (8 workers × 2 轮), 适配 2-4 核 runner; 本地可加大压力。
  # continue-on-error: 压测对 runner 负载敏感, 初期不阻塞合并;
  #   稳定后可改为 false 使其成为硬门禁。
  stress-test:
    name: "高并发 fixture 压测"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          allow-prereleases: true
      - name: 缓存 pip 依赖
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: stress-pip-${{ hashFiles('pyproject.toml') }}
          restore-keys: stress-pip-
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install -r requirements/requirements-dev.txt
      - name: 运行高并发 fixture 压测
        # workers=8 适配 CI 2-4 核 runner; rounds=2 平衡覆盖与耗时
        # 完整 4 阶段: xdist 并行 + 实例隔离 + 线程安全 + 泄漏检测
        run: |
          python scripts/stress_fixture_concurrency.py \
            --workers 8 \
            --rounds 2 \
            --instances 20 \
            --threads 8 \
            --ops 10
      - name: 归档压测结果
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stress-test-results
          path: stress-fixture-results.json
          retention-days: 7

  # ── 构建验证 (仅 Ubuntu, 快速检查打包) ──────────────────────────
  build:
    name: "构建验证 (wheel)"
    needs: [ci]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          allow-prereleases: true

      - name: 构建 wheel
        run: |
          python -m pip install build
          python -m build --wheel

      # FIX: 添加 import 验证, 确保打出的包可正常导入
      - name: 验证 wheel 可导入
        run: |
          python -m pip install dist/*.whl
          python -c "import pycoder; print(f'pycoder {pycoder.__version__} 导入成功')"
