name: Security Scan

# P2-5: CI/CD 安全扫描与回归防护
# P0 增强: CRITICAL 严重度阻断 + Bandit -ii + Semgrep --error
# 每次 push/PR 到 master 时运行：Bandit + Semgrep + pip-audit + pytest 覆盖率门禁
on:
    push:
        branches: [master, main]
    pull_request:
        branches: [master, main]
    workflow_dispatch:  # 允许手动触发 (setup_branch_protection.sh 自动调用)

# ── 最小权限原则: 显式声明 GITHUB_TOKEN 所需权限 ──────────
# contents: read          — 检出代码
# security-events: write  — 上传安全扫描结果到 GitHub Security tab
permissions:
    contents: read
    security-events: write

jobs:
    security:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.13"

            # ── 权限预检查: 验证 GITHUB_TOKEN 具备所需权限 ──────
            # 记录检查耗时、当前 scope、缺失 scope 等详细信息
            - name: 验证 GITHUB_TOKEN 权限
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  echo "═══════════════════════════════════════════════════"
                  echo "  GITHUB_TOKEN 权限预检查"
                  echo "═══════════════════════════════════════════════════"
                  START_TIME=$(date +%s)

                  # 运行权限检查, 捕获 JSON 输出
                  CHECK_OUTPUT=$(python scripts/gh_permissions.py \
                    --check-only \
                    --json \
                    --no-interactive \
                    --scopes repo workflow 2>&1) || true

                  END_TIME=$(date +%s)
                  ELAPSED=$((END_TIME - START_TIME))

                  # 解析 JSON 并打印详细 scope 信息
                  echo ""
                  echo "── 检查结果 ──────────────────────────────────────"
                  echo "$CHECK_OUTPUT" | python -c "
                  import sys, json
                  lines = sys.stdin.read()
                  start = lines.find('{')
                  if start == -1:
                      print('  (无法解析输出, 原始输出:)')
                      print(f'  {lines[:300]}')
                      sys.exit(0)
                  try:
                      data = json.loads(lines[start:])
                  except json.JSONDecodeError as e:
                      print(f'  (JSON 解析失败: {e})')
                      print(f'  原始输出: {lines[start:start+300]}')
                      sys.exit(0)

                  ok = data.get('ok', False)
                  print(f\"  通过:           {'✅' if ok else '❌'}\")
                  print(f\"  已认证:         {'✅' if data.get('authenticated') else '❌'}\")
                  print(f\"  Token 有效:     {'✅' if data.get('token_valid') else '❌'}\")
                  if data.get('username'):
                      print(f\"  用户名:         {data['username']}\")
                  current = data.get('current_scopes', [])
                  print(f\"  当前 scope ({len(current)}): {', '.join(current) if current else '(无)'}\")
                  required = data.get('required_scopes', [])
                  print(f\"  必需 scope ({len(required)}): {', '.join(required)}\")
                  missing = data.get('missing_scopes', [])
                  if missing:
                      print(f\"  缺失 scope ({len(missing)}): {', '.join(missing)}\")
                  else:
                      print(f\"  缺失 scope:     (无)\")
                  if data.get('error'):
                      print(f\"  错误信息:       {data['error']}\")
                  " 2>/dev/null || echo "  (JSON 解析失败, 原始输出: ${CHECK_OUTPUT:0:300})"

                  echo ""
                  echo "── 耗时 ──────────────────────────────────────────"
                  echo "  开始时间: $(date -d @${START_TIME} '+%Y-%m-%d %H:%M:%S UTC' 2>/dev/null || echo ${START_TIME})"
                  echo "  结束时间: $(date -d @${END_TIME} '+%Y-%m-%d %H:%M:%S UTC' 2>/dev/null || echo ${END_TIME})"
                  echo "  检查耗时: ${ELAPSED}s"
                  echo ""

                  # 判断最终结果
                  if echo "$CHECK_OUTPUT" | python -c "
                  import sys, json
                  lines = sys.stdin.read()
                  start = lines.find('{')
                  if start >= 0:
                      data = json.loads(lines[start:])
                      sys.exit(0 if data.get('ok') else 1)
                  sys.exit(1)
                  " 2>/dev/null; then
                    echo "✅ 权限检查通过 (耗时 ${ELAPSED}s)"
                  else
                    echo "⚠️  GITHUB_TOKEN 权限不足, 但 CI 将继续执行"
                    echo "    (GITHUB_TOKEN 使用 permissions: 块控制, 非 PAT scope)"
                    echo "    如需完整 scope 检查, 请使用 PAT 配置 GH_TOKEN secret"
                  fi
                  echo "═══════════════════════════════════════════════════"

            - name: Install dependencies
              run: |
                  pip install bandit semgrep pip-audit pytest pytest-cov pytest-asyncio
                  pip install -e ".[dev]" || pip install -e .

            - name: Bandit security scan (HIGH + MEDIUM)
              # Bandit 检测 Python 代码安全漏洞（SQL注入、命令注入、硬编码密码等）
              # P0 增强: -ii 报告 HIGH + MEDIUM 严重度（原 -ll 仅 HIGH）
              # CRITICAL/HIGH 级别发现将导致 CI 失败
              run: |
                  bandit -r pycoder/ -f json -o bandit-report.json -ii
                  # 检查是否有 HIGH 严重度问题，有则失败
                  python -c "
                  import json
                  with open('bandit-report.json') as f:
                      data = json.load(f)
                  high_issues = [r for r in data.get('results', []) if r.get('issue_severity') == 'HIGH']
                  if high_issues:
                      print(f'❌ Bandit 发现 {len(high_issues)} 个 HIGH 严重度问题:')
                      for issue in high_issues:
                          print(f\"  - {issue['filename']}:{issue['line_number']} {issue['test_name']}: {issue['issue_text']}\")
                      exit(1)
                  print(f'✅ Bandit 扫描通过（{len(data.get(\"results\", []))} 个 MEDIUM/LOW 问题）')
                  "

            - name: Semgrep scan (fail on error)
              # Semgrep 检测已知漏洞模式与反模式
              # P0 增强: --error 在发现问题时返回非零退出码
              run: semgrep scan --config auto pycoder/ --json -o semgrep-report.json --error

            - name: Audit dependencies for vulnerabilities
              # pip-audit 检测已知漏洞的依赖包
              # P0 增强: --strict 在任何漏洞发现时失败
              run: pip-audit --strict

            - name: Run tests with coverage gate
              # 覆盖率门禁针对 pycoder.server 核心运行时模块
              # 当前基线 41%（P2-1 目标模块 self_evolution/agent_orchestrator/agent_tools/files/code_exec 均 ≥80%）
              # 门禁设为 38% 防止回归；提升至 80% 为 P3+ 改进目标
              run: pytest --cov=pycoder.server --cov-report=xml --cov-report=term-missing --cov-fail-under=38 --timeout=120

            - name: Upload coverage to Codecov
              uses: codecov/codecov-action@v4
              if: always()
              with:
                  files: ./coverage.xml
                  fail_ci_if_error: false

            - name: Upload security reports
              uses: actions/upload-artifact@v4
              if: always()
              with:
                  name: security-reports
                  path: |
                      bandit-report.json
                      semgrep-report.json
                  retention-days: 30
