<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>超级玛丽</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #5c94fc;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: 'Arial', sans-serif;
        }
        canvas {
            border: 3px solid #000;
            image-rendering: pixelated;
        }
        #ui-overlay {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            font-size: 20px;
            text-shadow: 2px 2px 0 #000;
            z-index: 10;
            display: flex;
            gap: 40px;
        }
        #start-screen, #game-over-screen, #win-screen {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(0,0,0,0.7);
            color: white;
            z-index: 20;
        }
        #start-screen h1, #game-over-screen h1, #win-screen h1 {
            font-size: 48px;
            margin-bottom: 20px;
            text-shadow: 3px 3px 0 #e52521;
        }
        #start-screen p, #game-over-screen p, #win-screen p {
            font-size: 20px;
            margin-bottom: 10px;
        }
        .btn {
            padding: 15px 40px;
            font-size: 22px;
            background: #e52521;
            color: white;
            border: none;
            cursor: pointer;
            margin-top: 20px;
            border-radius: 8px;
            text-shadow: 1px 1px 0 #000;
        }
        .btn:hover { background: #ff4444; }
        .controls-info {
            margin-top: 30px;
            font-size: 16px;
            opacity: 0.8;
        }
    </style>
</head>
<body>
    <div id="ui-overlay">
        <span>分数: <span id="score">0</span></span>
        <span>金币: <span id="coins">0</span></span>
        <span>生命: <span id="lives">3</span></span>
        <span>时间: <span id="timer">300</span></span>
    </div>
    <canvas id="gameCanvas"></canvas>
    <div id="start-screen">
        <h1>🍄 超级玛丽 🍄</h1>
        <p>帮助马里奥拯救公主吧！</p>
        <button class="btn" onclick="startGame()">开始游戏</button>
        <div class="controls-info">
            <p>⬅➡ 方向键移动 | ⬆ 空格键跳跃 | P 暂停</p>
        </div>
    </div>
    <div id="game-over-screen" style="display:none;">
        <h1>💀 游戏结束</h1>
        <p>最终分数: <span id="final-score">0</span></p>
        <button class="btn" onclick="restartGame()">重新开始</button>
    </div>
    <div id="win-screen" style="display:none;">
        <h1>🎉 恭喜通关！</h1>
        <p>你拯救了公主！</p>
        <p>最终分数: <span id="win-score">0</span></p>
        <button class="btn" onclick="restartGame()">再玩一次</button>
    </div>
    <script src="game.js"></script>
</body>
</html>
