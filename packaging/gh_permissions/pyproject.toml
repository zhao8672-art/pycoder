# ════════════════════════════════════════════════════════════════════════════
#  gh-permissions — GitHub CLI 权限检查工具库
#
#  可复用的 token scope 验证、自动刷新和 CI 风格报告生成工具。
#  无外部依赖, 仅使用 Python 标准库。
#
#  构建: python -m build
#  发布: twine upload dist/*
#  本地安装: pip install -e .
# ════════════════════════════════════════════════════════════════════════════

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gh-permissions"
version = "1.0.0"
description = "GitHub CLI 权限检查工具库 — token scope 验证、自动刷新、CI 风格报告"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "PyCoder Team", email = "team@pycoder.ai" },
]
keywords = [
    "github",
    "gh-cli",
    "permissions",
    "scope",
    "ci",
    "authentication",
    "token",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Testing",
    "Topic :: System :: Systems Administration :: Authentication/Directory",
]
# 无外部依赖 — 仅使用 Python 标准库
dependencies = []

[project.urls]
Homepage = "https://github.com/PyCoder-ai/pycoder"
Repository = "https://github.com/PyCoder-ai/pycoder"
Documentation = "https://github.com/PyCoder-ai/pycoder/tree/main/scripts/gh_permissions"
"Bug Tracker" = "https://github.com/PyCoder-ai/pycoder/issues"

# CLI 入口点: pip install 后自动生成 gh-permissions 命令
[project.scripts]
gh-permissions = "gh_permissions.__main__:main"

[tool.setuptools]
packages = ["gh_permissions"]

[tool.setuptools.package-data]
gh_permissions = ["py.typed"]
