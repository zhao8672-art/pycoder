# ════════════════════════════════════════════════════════════════════════════
#  PyCoder — Native AI Coding Agent for Python Developers
#
#  ─── 依赖分层策略 ───
#  1. [project] 段: 核心运行时元数据, 通过 [tool.setuptools.dynamic]
#     引用 requirements/ 目录下的分层 .txt 文件
#  2. requirements/requirements.in        ← 唯一权威依赖源
#     requirements/requirements-dev.in    ← 开发工具
#     requirements/requirements-browser.in ← 浏览器自动化 (可选)
#     requirements/requirements-help.in   ← 交互式帮助 (可选)
#     requirements/requirements-playwright.in ← Playwright (可选)
#  3. requirements-all.txt                 ← pip install -r 一次性全量入口
#  4. 关键依赖 (fastapi/pydantic/httpx) 使用 ~= 锁定兼容版本
#
#  ─── 修改依赖的流程 ───
#  a) 编辑 requirements/requirements.in (或对应 .in)
#  b) 重新生成 .txt:  uv pip compile requirements/requirements.in -o requirements.txt
#  c) 测试:            python -m pip install -e ".[dev]"
#  d) 验证:            python scripts/check_readme_consistency.py
#
#  ─── 工具配置块 ───
#  [tool.pytest.ini_options]   ← pytest 8+ 配置 (testpaths / markers / addopts)
#  [tool.coverage.*]           ← coverage 6+ 配置 (branch / fail_under=60)
#  [tool.ruff]                 ← ruff lint + format 配置
#  [tool.black]                ← black 格式化配置
#  [tool.isort]                ← isort 导入排序配置
#  [tool.mypy]                 ← mypy 类型检查配置
#  [tool.bandit]               ← bandit 安全扫描配置
#
#  ─── 跨平台入口点 ───
#  pip install -e . 后自动生成:
#    pycoder        - 主 CLI (调用 pycoder.__main__:main)
#    pycoder-server - App Server (调用 pycoder.server.app:run)
#  Windows 用户也可使用 scripts/pycoder.bat / .ps1 包装器
# ════════════════════════════════════════════════════════════════════════════

[project]
name = "pycoder"
description = "PyCoder - Native AI Coding Agent for Python Developers"
authors = [
    { name = "PyCoder Team", email = "team@pycoder.ai" },
]
readme = "README.md"
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development",
    "Natural Language :: Chinese (Simplified)",
]
requires-python = ">=3.12"
version = "1.0.0"
dynamic = ["optional-dependencies"]
# [project.optional-dependencies] 由 setuptools 动态加载 (见下方 [tool.setuptools.dynamic.optional-dependencies])
# 非缺失: 这是 Python 标准做法，避免手动维护两份依赖列表

# 显式声明关键依赖 (精确锁定在 requirements.txt 中，此处使用兼容范围 ~=)
# 审计工具注意: dependencies 使用 ~= 是 pyproject.toml 标准写法，
# 精确锁定 (==) 在 requirements.txt (pip-compile 生成) 中，而非此处
# P3-B 依赖治理 (2026-07-25): 移除未使用的依赖
#   - litellm, openai: 项目使用 httpx 直接调用 LLM API，无需 SDK
#   - pydantic-settings: 仅在模板字符串中引用，未实际 import
#   - pdfplumber, opencv-python-headless: PDF/图像处理未使用
#   - orjson, jinja2: 未在代码中直接 import
# P3-B 漏洞修复 (2026-07-25): 升级有漏洞的依赖
#   - starlette 0.46.2 → 1.3.1+ (修复 7 个 CVE)
#   - Pillow 10.4.0 → 12.3.0+ (修复 14 个 CVE)
dependencies = [
    # Web 框架 (锁定 patch)
    "fastapi~=0.135.0",
    "uvicorn[standard]~=0.32.0",
    "pydantic~=2.12.0",
    "starlette>=1.3.1",
    "httpx~=0.27.0",
    # 错误监控
    "sentry-sdk[fastapi,httpx]~=2.10.0",
    # 多模态 (仅图像 + OCR)
    "Pillow>=12.3.0",
    "pytesseract~=0.3.13",
    # 工具
    "structlog",
    "python-multipart",
    "pyyaml",
]

[project.urls]
Homepage = "https://github.com/PyCoder-ai/pycoder"

[project.scripts]
pycoder = "pycoder.__main__:main"
pycoder-server = "pycoder.server.app:run"

# 跨平台桌面启动器 (Windows / macOS / Linux 通用入口)
[project.entry-points."pycoder.launchers"]
desktop = "pycoder.__main__:main"
server = "pycoder.server.app:run"

[tool.setuptools.dynamic.optional-dependencies]
dev = { file = "requirements/requirements-dev.txt" }
help = { file = "requirements/requirements-help.txt" }
browser = { file = "requirements/requirements-browser.txt" }
playwright = { file = "requirements/requirements-playwright.txt" }

[tool.setuptools]
include-package-data = true
packages.find.include = ["pycoder", "pycoder.*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.codespell]
skip = "*.svg,Gemfile.lock,tests/fixtures/*,aider/website/assets/*"
write-changes = true

# ── 代码格式化 ────────────────────────────────────

[tool.black]
line-length = 100
target-version = ["py312"]
include = '\.pyi?$'
extend-exclude = '''
/(
    \.eggs
  | \.git
  | \.venv
  | _build
  | build
  | dist
  | electron
  | node_modules
)/
'''

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
known_first_party = ["pycoder"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line-too-long (handled by black)
    "B008",  # do-not-perform-function-calls-in-argument-defaults
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**/*.py" = ["B011"]
"pycoder/server/services/agent_loop.py" = ["F821"]
"pycoder/server/services/autonomous_pipeline.py" = ["F821"]
"pycoder/server/services/unified_agent.py" = ["F821"]
"pycoder/server/services/team/agent_tool_loop.py" = ["F821"]
"pycoder/server/services/team/review_orchestrator.py" = ["F821"]

# ── 类型检查 ──────────────────────────────────────

[tool.mypy]
python_version = "3.12"
strict = true
show_error_codes = true
warn_unused_configs = true
ignore_missing_imports = true
exclude = [
    "build/",
    "dist/",
    ".eggs/",
    "tests/",
    "electron/",
]

# ── 安全扫描 ──────────────────────────────────────

[tool.bandit]
exclude_dirs = [
    "tests",
    "electron",
    ".skills",
    ".pycoder",
]
skips = [
    "B101",  # assert 语句在测试中允许
    "B311",  # 非密码学随机数在非安全场景允许
]
targets = ["pycoder"]

# ────────────────────────────────────────────────────────────────────
# Pytest 配置 (v8+)
# ────────────────────────────────────────────────────────────────────
# CI 分片策略 (解决完整测试套件 300s 超时问题):
#   1. 本地开发: 默认配置 (-n auto 并行 + --timeout=60 单测超时)
#   2. CI 快速门禁: pytest -m "not slow" (跳过慢测试, <120s)
#   3. CI 完整分片: 按 marker 拆分为多个并行 job
#      - shard-1: pytest -m "not slow and not integration" tests/core/
#      - shard-2: pytest -m "not slow and not integration" tests/server/
#      - shard-3: pytest -m "slow" (允许长超时)
#      - shard-4: pytest -m "integration" (需要外部服务)
#   4. 跨 job 并行: pytest-xdist -n auto 已在单机内并行;
#      跨机分片用 pytest-split 或 marker 切分。
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-ra",                  # 失败摘要总是显示
    "--strict-markers",     # 未注册 marker 报错
    "--strict-config",      # 配置错误立即失败
    "--showlocals",         # 失败时打印局部变量
    "--tb=short",           # 简短的 traceback
    "--durations=10",       # 显示最慢的 10 个测试
    "--durations-min=0.5",  # 仅显示耗时 >= 0.5s 的测试 (减少噪音)
    "--timeout=60",         # 单测超时 60s (pytest-timeout, 防止单测挂死拖垮整个套件)
    "-n", "auto",           # pytest-xdist 并行执行（按 CPU 核数自动分配）
]
markers = [
    "slow: 慢测试 (长时间运行, CI 默认跳过: pytest -m 'not slow')",
    "integration: 集成测试 (需要外部服务)",
    "network: 需要网络连接的测试",
    "windows: 仅在 Windows 平台运行",
    "posix: 仅在 POSIX (Linux/macOS) 平台运行",
]
filterwarnings = [
    "error",                                   # 警告变错误
    "ignore::DeprecationWarning:botocore.*",  # AWS SDK 警告噪音
    "ignore::DeprecationWarning:google.*",    # Google SDK 警告噪音
    "ignore::PendingDeprecationWarning",
]
asyncio_mode = "auto"
log_cli = false
log_cli_level = "INFO"
log_cli_format = "%(asctime)s [%(levelname)8s] %(name)s: %(message)s"
log_cli_date_format = "%Y-%m-%d %H:%M:%S"

# ────────────────────────────────────────────────────────────────────
# Coverage 配置
# ────────────────────────────────────────────────────────────────────
[tool.coverage.run]
branch = true
source = ["pycoder"]
omit = [
    "pycoder/__main__.py",          # CLI 入口, 难以覆盖
    "pycoder/electron/*",           # Electron 前端
    "pycoder/_version.py",          # 自动生成
    "pycoder/server/_legacy/*",     # 旧版代码
    "*/tests/*",
    "*/__init__.py",
    "*/conftest.py",
]
data_file = ".coverage"
parallel = false
sigterm = true

[tool.coverage.report]
show_missing = true
skip_covered = false
skip_empty = true
precision = 2
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "pass",
    "except ImportError:",
    "except ImportError,*:",
    "\\.\\.\\.",
    "if 0:",
    "if False:",
    "if false:",
    "def __repr__",
    "# pragma:",
]
exclude_also = [
    "raise AssertionError",
    "raise NotImplementedError",
    "if typing.TYPE_CHECKING:",
]
fail_under = 80            # 目标 80%+ 覆盖率门禁
sort = "Cover"

[tool.coverage.html]
directory = "htmlcov"

[tool.coverage.xml]
output = "coverage.xml"

# ────────────────────────────────────────────────────────────────────
# Setuptools 打包配置
# ────────────────────────────────────────────────────────────────────
[tool.setuptools.package-data]
pycoder = ["py.typed", "*.pyi", "templates/*", "static/*"]

# ────────────────────────────────────────────────────────────────────
# import-linter 依赖边界固化 (P2-D)
# ────────────────────────────────────────────────────────────────────
# 运行: lint-imports --config pyproject.toml
#
# 分层原则 (高层可依赖低层, 低层不得依赖高层):
#   L4 (顶层编排): pycoder.evolution / pycoder.lifecycle / pycoder.server
#   L3 (业务逻辑): pycoder.capabilities / pycoder.brain / pycoder.ai
#   L2 (基础设施): pycoder.memory / pycoder.providers / pycoder.safety
#   L1 (核心工具): pycoder.config / pycoder.observability
#   L0 (基础抽象): pycoder.core
#
# layers 数组顺序: 从高到低 (import-linter 约定)
#
# 验证命令:
#   lint-imports --config pyproject.toml
# ────────────────────────────────────────────────────────────────────
[tool.importlinter]
root_package = "pycoder"

[[tool.importlinter.contracts]]
name = "Layered architecture - 高层可依赖低层, 低层不得依赖高层"
type = "layers"
# 顺序: 从高到低
# P2-D: 调整分层顺序，将 server 提升至最上层（HTTP 路由层应可调用所有业务层）
layers = [
    "pycoder.server",
    "pycoder.lifecycle",
    "pycoder.evolution",
    "pycoder.capabilities",
    "pycoder.brain",
    "pycoder.ai",
    "pycoder.memory",
    "pycoder.providers",
    "pycoder.safety",
    "pycoder.config",
    "pycoder.observability",
    "pycoder.core",
]
# 容许同层互导 (顶层编排器之间会有少量互调, 后续逐步消除)
# P2-D: 已通过 importlib 动态加载消除 evolution→server、lifecycle→evolution 的静态依赖
ignore_imports = [
    # lifecycle 编排器委托 server 的 autonomous_pipeline (设计允许)
    "pycoder.lifecycle.adapters -> pycoder.server.services.autonomous_pipeline",
]

[[tool.importlinter.contracts]]
name = "Forbidden - core 不得依赖业务层 (最严格)"
type = "forbidden"
source_modules = ["pycoder.core"]
forbidden_modules = [
    "pycoder.server",
    "pycoder.brain",
    "pycoder.ai",
    "pycoder.capabilities",
    "pycoder.lifecycle",
    "pycoder.evolution",
    "pycoder.providers",
    "pycoder.memory",
    "pycoder.safety",
]

[[tool.importlinter.contracts]]
name = "Forbidden - observability 不得依赖业务层"
type = "forbidden"
source_modules = ["pycoder.observability"]
forbidden_modules = [
    "pycoder.server",
    "pycoder.brain",
    "pycoder.ai",
    "pycoder.capabilities",
    "pycoder.lifecycle",
    "pycoder.evolution",
    "pycoder.providers",
    "pycoder.memory",
    "pycoder.safety",
]
